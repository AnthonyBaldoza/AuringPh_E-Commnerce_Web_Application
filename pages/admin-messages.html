<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages · AuringPh Admin</title>
    <link rel="icon" href="../images/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/messaging.css" />
    <link rel="stylesheet" href="../css/admin-dark.css" />

    <!-- EMBEDDED ADMIN MESSAGES CSS -->
    <style>
      body.admin-body.admin-messages-page {
        --ink-900: #1c1815;
        --ink-700: #3d3530;
        --ink-500: #6b615c;
        --ink-400: #8a7f79;
        --ink-300: #b5a9a2;
        --ink-200: #e5dcd5;
        --ink-100: #f2ebe6;
        --ink-50: #faf6f3;
        --surface: #ffffff;
        --canvas: #f7f3ef;
        --accent: #8b4a24;
        --accent-600: #6b3618;
        --accent-100: #f5e3d5;
        --accent-50: #fbf1e8;
        --ok: #15803d;
        --ok-bg: #dcfce7;
        --warn: #b45309;
        --warn-bg: #fef3c7;
        --bad: #b91c1c;
        --bad-bg: #fee2e2;
        --info: #1e40af;
        --info-bg: #dbeafe;
        --line: #ece3db;
        --line-strong: #e0d5cc;
        --r-lg: 16px;
        --r-md: 12px;
        --r-sm: 8px;
        --shadow-xs: 0 1px 2px rgba(60, 40, 20, 0.04);
        --shadow-sm:
          0 1px 3px rgba(60, 40, 20, 0.06), 0 1px 2px rgba(60, 40, 20, 0.04);
        --shadow-md: 0 4px 14px rgba(60, 40, 20, 0.08);

        background: var(--canvas);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .admin-messages-page .icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        display: inline-block;
        vertical-align: middle;
      }
      .admin-messages-page .icon-sm {
        width: 15px;
        height: 15px;
      }

      .admin-messages-page .admin-layout {
        height: 100vh;
        height: 100dvh;
      }

      .admin-messages-page .admin-main {
        padding: 32px 40px 32px;
        max-width: none;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }

      /* ---------- Sidebar ---------- */
      .admin-messages-page .admin-sidebar {
        background: linear-gradient(180deg, #4a2514 0%, #3a1d10 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }
      .admin-messages-page .admin-sidebar-brand {
        padding: 22px 20px 20px;
      }
      .admin-messages-page .admin-nav {
        padding: 16px 12px;
      }
      .admin-messages-page .admin-nav-link {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.72);
      }
      .admin-messages-page .admin-nav-link .nav-ico {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        color: rgba(255, 255, 255, 0.72);
        transition: color 0.15s ease;
      }
      .admin-messages-page .admin-nav-link:hover .nav-ico {
        color: #fff;
      }
      .admin-messages-page .admin-nav-link.active {
        background: rgba(255, 224, 197, 0.95);
        color: #4a2514;
      }
      .admin-messages-page .admin-nav-link.active .nav-ico {
        color: #4a2514;
      }

      /* ---------- Topbar ---------- */
      .page-topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      .page-topbar-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .page-eyebrow {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-400);
        margin-bottom: 4px;
      }
      .page-title {
        font-family: var(--font-display);
        font-size: clamp(24px, 2.6vw, 30px);
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink-900);
        margin: 0;
      }
      .page-sub {
        font-size: 13.5px;
        color: var(--ink-500);
        margin-top: 4px;
      }
      .page-topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .page-icon-btn {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--ink-500);
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s,
          background 0.15s;
        position: relative;
      }
      .page-icon-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-50);
      }
      .page-badge-dot {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 7px;
        height: 7px;
        background: #dc2626;
        border-radius: 50%;
        box-shadow: 0 0 0 2px #fff;
      }

      /* ---------- Inbox Layout ---------- */
      .admin-inbox {
        display: flex;
        flex: 1;
        min-height: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
      }

      /* Left Sidebar */
      .inbox-sidebar {
        width: 320px;
        flex-shrink: 0;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--surface);
      }

      .inbox-sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }

      .inbox-title {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 600;
        color: var(--ink-900);
        margin-bottom: 12px;
      }

      .inbox-search-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink-50);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 8px 14px;
        color: var(--ink-400);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .inbox-search-wrap:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(139, 74, 36, 0.1);
        background: var(--surface);
      }
      .inbox-search {
        border: 0;
        outline: 0;
        background: transparent;
        font-family: var(--font-body);
        font-size: 13.5px;
        color: var(--ink-900);
        width: 100%;
      }
      .inbox-search::placeholder {
        color: var(--ink-300);
      }

      .inbox-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }

      /* Conversation Items */
      .conv-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        cursor: pointer;
        border-bottom: 1px solid var(--line);
        transition: background 0.15s;
      }
      .conv-item:hover {
        background: var(--ink-50);
      }
      .conv-item.active {
        background: var(--accent-50);
        border-left: 3px solid var(--accent);
        padding-left: 17px;
      }

      .conv-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--accent-100);
        color: var(--accent-600);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }
      .conv-avatar .online-dot {
        position: absolute;
        bottom: 1px;
        right: 1px;
        width: 10px;
        height: 10px;
        background: var(--ok);
        border-radius: 50%;
        border: 2px solid var(--surface);
      }

      .conv-info {
        flex: 1;
        min-width: 0;
      }
      .conv-name {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-900);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-preview {
        font-size: 12px;
        color: var(--ink-400);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }

      .conv-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex-shrink: 0;
      }
      .conv-time {
        font-size: 11px;
        color: var(--ink-400);
      }
      .conv-unread {
        background: var(--accent);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Right Main Area */
      .inbox-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #fdfcfa;
      }

      .inbox-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
      }

      .inbox-header-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--accent-100);
        color: var(--accent-600);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }
      .inbox-header-avatar .online-dot {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 11px;
        height: 11px;
        background: var(--ok);
        border-radius: 50%;
        border: 2px solid var(--surface);
      }

      .inbox-header-info {
        flex: 1;
        min-width: 0;
      }
      .inbox-header-name {
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
        color: var(--ink-900);
      }
      .inbox-header-sub {
        font-size: 12px;
        color: var(--ink-400);
        margin-top: 1px;
      }

      .btn-invoice {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn-invoice:hover {
        background: var(--accent-50);
        border-color: var(--accent);
      }

      /* Messages Area */
      .inbox-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
      }

      /* Override messaging.css bubbles for this specific theme */
      .admin-messages-page .msg-row {
        max-width: 75%;
        animation: bubbleIn 0.18s ease-out;
      }
      .admin-messages-page .msg-avatar-sm {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ink-100);
        color: var(--ink-500);
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .admin-messages-page .msg-row.from-me .msg-avatar-sm {
        background: var(--accent);
        color: #fff;
      }
      .admin-messages-page .msg-bubble {
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 18px 18px 18px 4px;
        padding: 12px 16px;
        font-size: 13.5px;
        color: var(--ink-900);
        line-height: 1.5;
        box-shadow: var(--shadow-sm);
      }
      .admin-messages-page .msg-row.from-me .msg-bubble {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent-600);
        border-radius: 18px 18px 4px 18px;
      }
      .admin-messages-page .msg-time {
        font-size: 11px;
        color: var(--ink-400);
        padding: 0 4px;
      }

      /* Invoice message bubble */
      .admin-messages-page .msg-bubble.msg-invoice {
        background: var(--accent-50);
        border-color: var(--accent-100);
        padding: 14px 18px;
      }
      .admin-messages-page .msg-row.from-me .msg-bubble.msg-invoice {
        background: #fff;
        border-color: var(--line-strong);
        color: var(--ink-900);
      }
      .admin-messages-page .invoice-tag {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .admin-messages-page .invoice-details {
        font-size: 13px;
        line-height: 1.6;
      }
      .admin-messages-page .invoice-id {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 4px;
        color: var(--ink-900);
      }

      .admin-messages-page .chat-date-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-400);
        margin: 8px 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .admin-messages-page .chat-date-divider::before,
      .admin-messages-page .chat-date-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      /* Input Area */
      .inbox-input-area {
        padding: 16px 24px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        flex-shrink: 0;
      }

      .inbox-quick-replies {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .quick-reply-btn {
        background: var(--ink-50);
        color: var(--ink-500);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
      }
      .quick-reply-btn:hover {
        background: var(--accent-50);
        color: var(--accent);
        border-color: var(--accent);
      }

      .inbox-input-row {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }
      .inbox-textarea {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 20px;
        font-size: 13.5px;
        font-family: var(--font-body);
        color: var(--ink-900);
        background: var(--ink-50);
        resize: none;
        outline: none;
        min-height: 44px;
        max-height: 120px;
        line-height: 1.4;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .inbox-textarea:focus {
        border-color: var(--accent);
        background: var(--surface);
      }

      .inbox-send-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .inbox-send-btn:hover {
        background: var(--accent-600);
        transform: translateY(-1px);
      }
      .inbox-send-btn:active {
        transform: scale(0.96);
      }

      /* Empty State */
      .inbox-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 40px;
      }
      .inbox-empty-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--accent-50);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
      }
      .inbox-empty-title {
        font-family: var(--font-display);
        font-size: 20px;
        color: var(--ink-900);
      }
      .inbox-empty-sub {
        font-size: 13.5px;
        color: var(--ink-400);
        max-width: 300px;
        line-height: 1.5;
      }

      /* ---------- Modals ---------- */
      .admin-messages-page .admin-modal-box {
        border-radius: var(--r-lg);
        border: 1px solid var(--line);
        padding: 26px 26px 24px;
      }
      .admin-messages-page .admin-modal-box h3 {
        font-family: var(--font-display);
        font-size: 20px;
        margin-bottom: 18px;
        color: var(--ink-900);
        letter-spacing: -0.005em;
      }
      .admin-messages-page .admin-form-group {
        margin-bottom: 16px;
      }
      .admin-messages-page .admin-form-group label {
        font-size: 11.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-500);
        margin-bottom: 7px;
        display: block;
      }
      .admin-messages-page .admin-form-group input,
      .admin-messages-page .admin-form-group select {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        font-size: 14px;
        padding: 10px 12px;
        outline: none;
        transition: border-color 0.15s;
        color: var(--ink-900);
      }
      .admin-messages-page .admin-form-group input:focus,
      .admin-messages-page .admin-form-group select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(139, 74, 36, 0.1);
      }

      .admin-messages-page .admin-modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      .admin-messages-page .admin-modal-actions button {
        flex: 1;
        min-height: 44px;
        padding: 10px 0;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.15s;
      }
      .admin-messages-page .modal-btn-cancel {
        background: var(--surface);
        color: var(--ink-500);
        border: 1px solid var(--line-strong) !important;
      }
      .admin-messages-page .modal-btn-cancel:hover {
        background: var(--ink-50);
      }
      .admin-messages-page .modal-btn-save {
        background: var(--accent);
        color: #fff;
      }
      .admin-messages-page .modal-btn-save:hover {
        background: var(--accent-600);
      }

      /* Responsive */
      @media (max-width: 900px) {
        .inbox-sidebar {
          width: 260px;
        }
      }
      @media (max-width: 768px) {
        .admin-messages-page .admin-main {
          padding: 20px 16px;
        }
        .admin-inbox {
          flex-direction: column;
        }
        .inbox-sidebar {
          width: 100%;
          height: 220px;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        .inbox-main {
          height: calc(100% - 220px);
        }
      }
    </style>
  </head>
  <body class="admin-body admin-messages-page">

    <script src="../js/admin.js"></script>
    <script src="../js/messaging.js"></script>
    <script>
      // Keep the original business logic, just update the toast function to use the global one.
      const ADMIN_ROLE = "admin";
      let activeUserId = null;
      let allChatsCache = {};

      // ── Demo users (in real app, pulled from user DB) ──
      const demoUsers = [
        { id: "user_ac", name: "Anna Cramling", email: "cramling@gmail.com" },
        { id: "user_jd", name: "Juan dela Cruz", email: "jdc@email.com" },
        { id: "user_ms", name: "Maria Santos", email: "msantos@email.com" },
      ];

      // Add the actual currently-registered/logged-in user
      const storedRealUser = JSON.parse(localStorage.getItem("user")) || null;
      if (storedRealUser && storedRealUser.email) {
        const realName =
          `${storedRealUser.firstName || ""} ${storedRealUser.lastName || ""}`.trim() ||
          "Guest User";
        const realId =
          "user_" +
          storedRealUser.email.toLowerCase().replace(/[^a-z0-9]/g, "_");
        if (!demoUsers.some((u) => u.id === realId)) {
          demoUsers.unshift({
            id: realId,
            name: realName,
            email: storedRealUser.email,
          });
        }
      }

      // Seed demo data for all demo users
      seedDemoIfEmpty("user_ac", "Anna Cramling");

      function seedOtherUsers() {
        const all = getAllChats();
        if (!all["user_jd"] || all["user_jd"].messages.length === 0) {
          postMessage(
            "user_jd",
            "user",
            "Magandang araw! May concern ako sa aking order.",
          );
          postMessage(
            "user_jd",
            "admin",
            "Magandang araw din! Paano kita matutulungan? 😊",
          );
          postMessage(
            "user_jd",
            "user",
            "Puwede ba akong humingi ng invoice para sa order ko na #ORD-20241005?",
          );
        }
        if (!all["user_ms"] || all["user_ms"].messages.length === 0) {
          postMessage(
            "user_ms",
            "user",
            "Hi! I need to know the status of my payment.",
          );
          postMessage(
            "user_ms",
            "admin",
            "Hi Maria! Let me check that for you.",
          );
        }
      }
      seedOtherUsers();

      // ── Render conversation list ──
      function renderConvList(filter = "") {
        const all = getAllChats();
        const container = document.getElementById("convList");
        let html = "";

        demoUsers.forEach((u) => {
          const thread = all[u.id];
          const msgs = thread ? thread.messages : [];
          const last = msgs[msgs.length - 1];
          const preview = last
            ? last.type === "invoice"
              ? "📄 Invoice sent"
              : last.text.slice(0, 40) + (last.text.length > 40 ? "…" : "")
            : "No messages yet";
          const time = last ? formatTime(last.time) : "";
          const unread = getUserUnread(u.id);
          const initials = getInitials(u.name);
          const isActive = u.id === activeUserId ? "active" : "";
          const lf = filter.toLowerCase();

          if (
            filter &&
            !u.name.toLowerCase().includes(lf) &&
            !u.email.toLowerCase().includes(lf)
          )
            return;

          html += `
        <div class="conv-item ${isActive}" onclick="openConversation('${u.id}', '${u.name}', '${u.email}')">
          <div class="conv-avatar">${initials}<span class="online-dot"></span></div>
          <div class="conv-info">
            <div class="conv-name">${u.name}</div>
            <div class="conv-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="conv-meta">
            <div class="conv-time">${time}</div>
            ${unread > 0 ? `<div class="conv-unread">${unread}</div>` : ""}
          </div>
        </div>`;
        });

        container.innerHTML =
          html ||
          '<div style="padding:24px;color:var(--ink-400);font-size:13px;text-align:center;">No conversations found.</div>';

        // Update admin unread badge
        const total = demoUsers.reduce((s, u) => s + getUserUnread(u.id), 0);
        const badge = document.getElementById("adminUnreadBadge");
        badge.textContent =
          total > 0
            ? `${total} unread message${total > 1 ? "s" : ""}`
            : "0 unread messages";
      }

      function filterConvs(val) {
        renderConvList(val);
      }

      // ── Open a conversation ──
      function openConversation(userId, name, email) {
        activeUserId = userId;
        markRead(userId, "admin");

        document.getElementById("emptyState").style.display = "none";
        const area = document.getElementById("activeChatArea");
        area.style.display = "flex";

        document.getElementById("activeUserAvatar").textContent =
          getInitials(name);
        document.getElementById("activeUserName").textContent = name;
        document.getElementById("activeUserSub").textContent = email;

        const thread = getThread(userId);
        renderThread(
          thread.messages,
          ADMIN_ROLE,
          document.getElementById("adminChatMessages"),
        );
        renderConvList();
      }

      // ── Send admin message ──
      function sendAdminMessage() {
        if (!activeUserId) return;
        const input = document.getElementById("adminMessageInput");
        const text = input.value.trim();
        if (!text) return;
        postMessage(activeUserId, "admin", text);
        input.value = "";
        autoResize(input);
        renderThread(
          getThread(activeUserId).messages,
          ADMIN_ROLE,
          document.getElementById("adminChatMessages"),
        );
        renderConvList();
      }

      function handleAdminKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendAdminMessage();
        }
      }

      function insertAdminQuick(text) {
        const input = document.getElementById("adminMessageInput");
        input.value = text;
        input.focus();
        autoResize(input);
      }

      // ── Send Invoice modal ──
      function openSendInvoice() {
        document.getElementById("sendInvoiceModal").classList.add("open");
      }

      function closeSendInvoice() {
        document.getElementById("sendInvoiceModal").classList.remove("open");
      }

      function submitSendInvoice() {
        if (!activeUserId) return;
        const inv = {
          id:
            document.getElementById("siId").value.trim() ||
            "#INV-" + Date.now(),
          order: document.getElementById("siOrder").value.trim() || "N/A",
          item: document.getElementById("siItem").value.trim() || "Item",
          amount: document.getElementById("siAmount").value.trim() || "₱0",
          date:
            document.getElementById("siDate").value.trim() ||
            new Date().toLocaleDateString("en-PH", {
              month: "short",
              day: "numeric",
              year: "numeric",
            }),
          status: document.getElementById("siStatus").value || "Paid",
        };
        postMessage(activeUserId, "admin", "", {
          type: "invoice",
          invoice: inv,
        });
        closeSendInvoice();
        renderThread(
          getThread(activeUserId).messages,
          ADMIN_ROLE,
          document.getElementById("adminChatMessages"),
        );
        renderConvList();
        showAdminToast("Invoice sent to customer!");
        ["siId", "siOrder", "siItem", "siAmount", "siDate"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
      }

      function autoResize(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      }

      // ── Polling to refresh list and active thread ──
      setInterval(() => {
        renderConvList();
        if (activeUserId) {
          const thread = getThread(activeUserId);
          const container = document.getElementById("adminChatMessages");
          const prev = container.querySelectorAll(".msg-row").length;
          if (thread.messages.length !== prev) {
            renderThread(thread.messages, ADMIN_ROLE, container);
          }
        }
      }, 2000);

      // Initial render
      renderConvList();
    </script>
